filter astra_strongswan_connection_success_filter {
    match("^strongswan_connection_success$" value("MSG.astra-charon-nm.message_id"));
};

destination astra_strongswan_connection_success_dbus_dst {
    python(
	class("syslog_ng_mod_astra.astra_syslog_ng_destination.AstraSyslogNgDestination")
	options("destination_type", "dbus"
		"message_type", "charon-nm"
		"event_user", "@all"
		"event_group", "@all"
		"event_id", "strongswanConnectionSuccess"
		"event_title", "strongswan: подключениe установлено"
		"event_icon", ""
		"event_params", "body"
		"event_format", "{0}")
	persist-name("strongswan_connection_success")
	);
};

log {
    source(astra_events_src);
    parser(astra_events_parser);
    filter(astra_strongswan_connection_success_filter);
    destination(astra_strongswan_connection_success_dbus_dst);
};
